.logo .name { font-family: var(--display); font-weight: 700; font-size: 20px; }

main.wrap { display: flex; flex-direction: column; gap: 28px; padding-block: 28px 48px; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }

.facts { display: flex; flex-direction: column; }

      summary(list),
      el("section", {}, el("h2", { text: "Par personne" }), el("div", { class: "table-box" }, el("table", { class: "plain" },
        el("thead", {}, el("tr", {}, ["Personne", "Vérifications", ...LEVELS.map((l) => l[1])].map((h) => el("th", { text: h })))),
        el("tbody", {}, Object.keys(byPerson).sort((a, b) => persons[a].localeCompare(persons[b], "fr")).map((pid) => el("tr", {},
          el("td", {}, el("button", { type: "button", class: "linkish", on: { click: () => go("personne", pid) } }, persons[pid])),
          el("td", { class: "num", text: String(byPerson[pid].length) }),
          LEVELS.map(([k]) => el("td", { class: "num", text: String(byPerson[pid].filter((f) => f.verdict === k).length) })))))))),
      el("h2", { text: "Les " + list.length + " faits" }), factList(list),
    ];
  },
  methodologie() {
    const counts = Object.fromEntries(usedSources.map((s) => [s, facts.filter((f) => f.reviews.some((r) => r.source_id === s)).length]));
    return [el("div", { class: "prose" },
      el("h1", { text: "Méthodologie" }),
      el("p", { text: "L'Observatoire ne produit aucun verdict. Il recense des vérifications publiées par des rédactions de fact-checking, les rattache à des personnalités politiques identifiées et les rend consultables par période, parti, personne, verdict et source." }),
      el("h2", { text: "Principes" }),
      el("ul", {},
        el("li", { text: "Le verdict affiché est celui de la source, avec son libellé d'origine toujours visible." }),
        el("li", { text: "Chaque entrée donne le lien vers l'article, la date de la déclaration, la date de la vérification et le nom de la rédaction." }),
        el("li", { text: "Un verdict qui ne se place pas sur l'axe vrai/faux est classé « non classable », jamais forcé." }),
        el("li", { text: SCOPE + " Les rédactions choisissent ce qu'elles vérifient, souvent des propos qui suscitent un doute : ces chiffres ne mesurent pas la sincérité d'une personne." }),
        el("li", { text: "Le parti indiqué est celui en vigueur à la date de la déclaration, d'après des affiliations publiques et datées. Faute de date fiable, le parti n'est pas indiqué." }),
        el("li", { text: "Seules des métadonnées sont reprises (titre, verdict, dates, lien), jamais le contenu des articles." }),
        el("li", { text: "Toute attribution incertaine est vérifiée à la main avant publication. Aucun classement des personnalités n'est proposé." })),
      el("h2", { text: "Votona et l'Observatoire" }),
      el("p", {}, "Votona compare vos positions à celles des candidats ; l'Observatoire recense ce que les rédactions de fact-checking ont vérifié. Les deux outils partagent la liste des candidats, mais ", el("strong", { text: "les vérifications n'entrent jamais dans le classement de Votona" }), ", et l'Observatoire n'interprète aucune position."),
      el("p", { text: "Périmètre par défaut : les candidats déclarés ou pressentis à la présidentielle 2027 de la liste Votona. « Leurs partis » ajoute les déclarations des membres de leurs partis, selon le parti en vigueur à la date de chaque déclaration. « Toute la vie politique » montre l'ensemble de la base : élus, membres du gouvernement, dirigeants de parti, maires." }),
      el("h2", { text: "Sources" }),
      el("div", { class: "table-box" }, el("table", { class: "plain" }, el("thead", {}, el("tr", {}, el("th", { text: "Rédaction" }), el("th", { text: "Déclarations dans la base" }))),
        el("tbody", {}, usedSources.map((s) => el("tr", {}, el("td", { text: sourceNames[s] || s }), el("td", { class: "num", text: String(counts[s]) })))))),
      el("p", { class: "small muted", text: "Collecte : API Google Fact Check Tools (vérifications déclarées par les rédactions) et flux ClaimReview de Data Commons (licence CC BY). Personnalités et affiliations : Wikidata." }),
      el("h2", { text: "Échelle commune" }),
      el("div", { class: "table-box" }, el("table", { class: "plain" }, el("thead", {}, el("tr", {}, el("th", { text: "Niveau" }), el("th", { text: "Exemples de libellés d'origine" }))),
        el("tbody", {}, [["true", "Vrai, Correct"], ["mostly_true", "Plutôt vrai"], ["half_true", "À moitié vrai, Imprécis, En partie vrai"], ["mostly_false", "Plutôt faux, Trompeur, Exagéré"], ["false", "Faux, Inventé"], ["unrated", "Manque de contexte, Montage, Invérifiable"]].map(([k, ex]) =>
          el("tr", {}, el("td", {}, swatch(k), " " + LEVEL[k].label), el("td", { text: ex })))))),
      el("p", { text: "Quand plusieurs rédactions vérifient la même déclaration, toutes les vérifications sont affichées ; le compteur retient le verdict le plus fréquent, et « non classable » en cas d'égalité." }),
      el("h2", { text: "Limites de la version bêta" }),
      el("ul", {},
        el("li", { text: "Périmètre : France ; personnalités ayant exercé une fonction publique depuis 2017." }),
        el("li", { text: "Certains libellés intermédiaires sont classés « non classable » en attendant leur validation." }),
        el("li", { text: "Les affiliations partisanes de Wikidata sont souvent non datées : beaucoup de déclarations n'ont pas encore de parti indiqué." }),
        el("li", { text: "Les noms de partis sont les noms actuels (par exemple Renaissance pour La République en marche)." })),
      el("h2", { text: "Contester une entrée, vos droits" }),
      el("p", {}, "Pour signaler une erreur, demander une rectification ou vous opposer au traitement de données vous concernant, écrivez à ", el("strong", { text: DATA.contact }), " en indiquant la référence de l'entrée (bouton « Signaler une erreur »). Une attribution contestée à raison est retirée sous 48 heures."),
      el("p", { class: "small muted", text: "Données mises à jour le " + frDate(DATA.generated_at, true) + "." }))];
  },
};

function render() {
  const navView = state.view === "personne" ? (candidateById[state.id] ? "candidats" : "personnalites") : state.view === "parti" ? "partis" : state.view;
  $("nav").replaceChildren(...VIEWS.map(([v, l]) => el("button", { type: "button", "data-go": v, "aria-current": v === navView ? "page" : null }, l)));
  $("app").replaceChildren(...views[state.view](),
    el("footer", {}, el("span", { text: "Votona Observatoire ne produit aucun verdict : il reprend celui de la source." }),
      el("span", {}, el("a", { href: VOTONA, target: "_blank", rel: "noopener", text: "Votona, le test présidentielle 2027" }), " · ",
        el("button", { type: "button", class: "linkish", style: "font-weight:400", "data-go": "methodologie" }, "Méthodologie"), " · Mise à jour : " + frDate(DATA.generated_at))));
}

fromHash();
render();
</script>

</body>
</html>
