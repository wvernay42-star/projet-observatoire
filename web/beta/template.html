<title>Votona Observatoire - les déclarations vérifiées</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Charte Votona (fond crème, violet, Baloo 2 / Work Sans / IBM Plex Mono, largeur 880 px) ;
   échelle des verdicts propre à l'Observatoire (bleu → orange), distincte du vert/rouge « pour/contre » de Votona. */
:root {
  --bg: #fbfaf7; --surface: #ffffff; --soft: #f1ece0; --fg: #191d2b; --muted: #4d5468; --faint: #6b7284; --line: #e4dfd0;
  --link: #6d28d9; --accent: #7C3AED; --accent-ink: #ffffff;
  --accent-soft: #efe4fd; --off: #e9e4d6; --warn-bg: #fbecd1; --warn-fg: #6b4206;
  --v-true: #1f5fa8; --v-mostly_true: #9dc0e6; --v-half_true: #cfc8ba; --v-mostly_false: #f2b57e; --v-false: #b4500a;
  --hatch: #c9c2b2; --unrated-line: #8a8170;
  --display: "Baloo 2", ui-rounded, system-ui, sans-serif;
  --sans: "Work Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --radius: 20px; --gutter: clamp(20px, 4vw, 40px);
  --masthead-bg: #F6F2FE; --masthead-ink: #191d2b; --masthead-line: rgba(25,29,43,.14); --masthead-accent: #7C3AED;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171c; --surface: #1c2028; --soft: #252a36; --fg: #f1ede4; --muted: #aab0c0; --faint: #8f96a8; --line: #2d323f;
  --link: #b9a2fb; --accent: #A78BFA; --accent-ink: #1c1230;
  --accent-soft: #2f2350; --off: #2d323f; --warn-bg: #3a2a12; --warn-fg: #f0c27a;
  --v-true: #4f8fd6; --v-mostly_true: #9dc0e6; --v-half_true: #b9b2a4; --v-mostly_false: #f2b57e; --v-false: #e07a32;
  --hatch: #4a525c; --unrated-line: #8d96a1; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14171c; --surface: #1c2028; --soft: #252a36; --fg: #f1ede4; --muted: #aab0c0; --faint: #8f96a8; --line: #2d323f;
  --link: #b9a2fb; --accent: #A78BFA; --accent-ink: #1c1230;
  --accent-soft: #2f2350; --off: #2d323f; --warn-bg: #3a2a12; --warn-fg: #f0c27a;
  --v-true: #4f8fd6; --v-mostly_true: #9dc0e6; --v-half_true: #b9b2a4; --v-mostly_false: #f2b57e; --v-false: #e07a32;
  --hatch: #4a525c; --unrated-line: #8d96a1; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
a { color: var(--link); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(26px, 3.6vw + 8px, 38px); }
h2 { font-size: 24px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.masthead { position: sticky; top: 0; z-index: 20; background: var(--bg); }
/* Bandeau : copie de header.topbar / .brand / .icon-btn de Votona (index.html et pages générées). */
header.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1180px; margin: 0 auto; padding: 16px var(--gutter); border-bottom: 3px solid var(--masthead-accent); background: var(--masthead-bg); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--masthead-ink); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.brand .mark { width: 40px; height: 32px; flex: none; transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
.brand:hover .mark { transform: rotate(-8deg) scale(1.08); }
.brand .mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
.brand .name { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .2px; white-space: nowrap; transition: color .15s ease; }
.brand:hover .name { color: var(--masthead-accent); }
.brand .year { font-family: var(--mono); font-size: 11px; color: var(--masthead-accent); letter-spacing: .06em; white-space: nowrap; }
.brand .beta-tag { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: #6b4206; background: #fbecd1; border-radius: 999px; padding: 2px 7px; }
.topbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--masthead-line); background: transparent; color: var(--masthead-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; padding: 0; }
.icon-btn:hover, .icon-btn[aria-current="page"] { color: var(--masthead-accent); border-color: var(--masthead-accent); }
/* Lien vers le site frère : même composant que le lien « Observatoire » de la barre de Votona. */
.sister-link { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--masthead-line); color: var(--masthead-ink); font-family: var(--sans); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.sister-link:hover { color: var(--masthead-accent); border-color: var(--masthead-accent); }
@media (max-width: 480px) { .sister-link { width: 34px; padding: 0; justify-content: center; } .sister-link span { display: none; } }
@media (max-width: 420px) { .brand .beta-tag { display: none; } }
/* Onglets : une rangée sous le bandeau, défilante sur mobile. */
nav.subnav { border-bottom: 1px solid var(--line); background: var(--bg); }
nav.subnav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.subnav .wrap::-webkit-scrollbar { display: none; }
nav.subnav button, nav.subnav a { flex: none; text-decoration: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; font-size: 14.5px; font-weight: 600; padding: 12px 12px 9px; cursor: pointer; min-height: 44px; }
nav.subnav .wrap > :first-child { margin-left: -12px; }
nav.subnav button:hover, nav.subnav a:hover { color: var(--accent); }
nav.subnav [aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
@media (max-width: 480px) { nav.subnav button, nav.subnav a { padding: 12px 8px 9px; font-size: 14px; } nav.subnav .wrap > :first-child { margin-left: -8px; } nav.subnav .lg { display: none; } }

main.wrap { display: flex; flex-direction: column; gap: 28px; padding-block: 28px 48px; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.filters label, .filters fieldset { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; border: 0; padding: 0; margin: 0; min-width: 0; }
.filters select, .filters input[type="search"], .filters input[type="date"] { min-height: 44px; font: inherit; font-weight: 400; font-size: 14px; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); max-width: 100%; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 20px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pill[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.pill.verdict[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
.sw.unrated { background: repeating-linear-gradient(45deg, var(--surface) 0 3px, var(--hatch) 3px 5px); border: 1px dashed var(--unrated-line); }
.reset { background: none; border: 0; color: var(--link); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; min-height: 40px; }

.summary { display: flex; flex-wrap: wrap; gap: 28px; }
.summary .bars { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 84px; align-items: center; gap: 12px; font-size: 15px; }
.bar-row .lab { font-weight: 600; }
.track { height: 22px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; }
.fill.unrated { background: repeating-linear-gradient(45deg, var(--surface) 0 4px, var(--hatch) 4px 6px); box-shadow: inset 0 0 0 1px var(--unrated-line); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.side { flex: 1 1 240px; border: 1px solid var(--line); border-radius: var(--radius); align-self: flex-start; background: var(--surface); }
.side > div { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.side > div:last-child { border-bottom: 0; }
.side .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.side .v { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.scope-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.claim { font-family: var(--sans); font-weight: 500; font-size: 17px; line-height: 1.4; margin: 0; }
.meter { display: flex; gap: 3px; }
.meter span { width: 30px; height: 10px; border-radius: 2px; background: var(--off); }
.verdict { font-size: 14px; }
.verdict strong { font-size: 15px; }
.dates { font-size: 13px; color: var(--muted); }
.fallback { font-style: italic; }
.who { font-size: 14px; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--link); cursor: pointer; text-decoration: none; font-weight: 700; text-align: left; }
.linkish:hover { text-decoration: underline; }

.facts { display: flex; flex-direction: column; }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 260px); gap: 8px 24px; padding: 18px 0; border-top: 1px solid var(--line); }
.fact .right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; text-align: right; }
@media (max-width: 640px) { .fact { grid-template-columns: minmax(0, 1fr); } .fact .right { align-items: flex-start; text-align: left; } .bar-row { grid-template-columns: 100px minmax(0, 1fr) 70px; font-size: 14px; } }
.report { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.report code { font-size: 12px; }
/* Pages fixes : « Signaler une erreur » sans script. */
details.report-d { display: inline; }
details.report-d summary { cursor: pointer; color: var(--muted); list-style: none; display: inline; }
details.report-d summary::-webkit-details-marker { display: none; }
details.report-d[open] summary { margin-bottom: 6px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; font-weight: 600; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
a.tile { text-decoration: none; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; width: 100%; border-radius: 18px; padding: 14px 22px; font-family: var(--sans); font-size: 15px; font-weight: 800; line-height: 1.25; text-align: center; text-decoration: none; cursor: pointer; border: 0; transition: transform .1s ease, background .15s ease, color .15s ease, border-color .15s ease; }
.btn:active { transform: translateY(2px); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-bottom: 4px solid color-mix(in srgb, var(--accent) 70%, black); animation: softPulse 2.6s ease-in-out infinite; }
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 90%, black); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--muted); border: 2px solid color-mix(in srgb, var(--accent) 20%, var(--line)); }
.btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
.btn-row { max-width: 420px; margin-left: auto; margin-right: auto; }
.btn-mascot { width: 34px; height: auto; flex: none; margin: -8px 2px -8px -4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
.btn:hover .btn-mascot { transform: rotate(-10deg) scale(1.1); }
.btn-sm { width: auto; padding: 8px 14px; font-size: 13px; font-weight: 700; border-radius: 14px; }
@keyframes softPulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .btn-accent { animation: none; } }

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 24px; }
.people button, .people a { text-decoration: none; display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font: inherit; cursor: pointer; min-height: 44px; }
.people button:hover .n1, .people a:hover .n1 { text-decoration: underline; }
.people .n2 { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.head { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 30px; font-weight: 800; flex: none; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 4px 10px; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cand { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.cand.withdrawn { opacity: .7; }
/* Couleur du candidat : même dégradé et même pastille que ses fiches sur Votona (--cc). */
.head.cc { padding: 20px; border-radius: 22px; background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 20%, var(--surface)), color-mix(in srgb, var(--cc) 6%, var(--surface))); border: 1px solid color-mix(in srgb, var(--cc) 28%, var(--surface)); }
.avatar.cc { background: var(--cc); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--cc) 40%, transparent); }
.cand.cc { background: linear-gradient(150deg, color-mix(in srgb, var(--cc) 14%, var(--surface)), var(--surface) 75%); border-color: color-mix(in srgb, var(--cc) 24%, var(--line)); transition: transform .15s, border-color .15s; }
.cand.cc:hover { border-color: var(--cc); transform: translateY(-2px); }
.cand .nm { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--cc); color: #fff; font-family: var(--display); font-weight: 800; font-size: 13px; box-shadow: 0 3px 8px color-mix(in srgb, var(--cc) 35%, transparent); }
.cand .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.cand .cnt { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.scope { display: flex; flex-wrap: wrap; gap: 6px; }
.timeline { position: relative; height: 44px; border-bottom: 2px solid var(--line); }
.timeline span { position: absolute; bottom: 7px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-7px); }
.timeline span.unrated { background: var(--surface); border: 2px dashed var(--unrated-line); }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.prose { max-width: 70ch; display: flex; flex-direction: column; gap: 14px; }
.prose p, .prose ul { margin: 0; }
.prose li { margin-bottom: 6px; }
.table-box { overflow-x: auto; }
table.plain { border-collapse: collapse; font-size: 14px; min-width: 520px; }
table.plain th, table.plain td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
footer.gfoot { margin-top: 20px; font-size: 12px; color: var(--faint); text-align: center; line-height: 1.6; }
footer.gfoot .flinks a, footer.gfoot .flinks button { color: var(--accent); font-weight: 600; }
footer.gfoot .social { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
footer.gfoot .social a { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); color: var(--accent); text-decoration: none; }
footer.gfoot .social a:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--v-true); outline-offset: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; }

.lede { max-width:70ch; margin:8px 0 0; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
@media (max-width:480px) { .kpis { grid-template-columns:1fr 1fr; } .kpi .v { font-size:22px; } }
.kpi { border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--surface); display:flex; flex-direction:column; gap:2px; }
.kpi .v { font-family:var(--mono); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
.kpi .k { font-size:13px; color:var(--muted); }
.cov { height:8px; background:var(--soft); border-radius:4px; overflow:hidden; margin-top:6px; }
.cov > div { height:100%; background:var(--accent); }
.sect { display:flex; flex-direction:column; gap:14px; }
.sect-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.tile { position:relative; text-align:left; border:1px solid var(--line); border-radius:18px; padding:14px 16px; background:var(--surface); color:var(--fg); font:inherit; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-height:44px; transition:transform .15s, box-shadow .15s, border-color .15s; }
.tile:hover { border-color:var(--accent); transform:translateY(-2px); }
.tile.theme { padding-right:62px; background:linear-gradient(150deg, color-mix(in srgb, var(--th) 22%, var(--surface)), color-mix(in srgb, var(--th) 6%, var(--surface))); border-color:color-mix(in srgb, var(--th) 30%, var(--surface)); }
.tile.theme:hover { border-color:var(--th); }
.tile .prop { position:absolute; top:10px; right:10px; width:44px; height:44px; object-fit:contain; }
.theme-hero { position:relative; padding:22px 120px 22px 22px; border-radius:24px; background:linear-gradient(135deg, color-mix(in srgb, var(--th) 26%, var(--surface)), color-mix(in srgb, var(--th) 8%, var(--surface))); border:1px solid color-mix(in srgb, var(--th) 35%, var(--surface)); }
.theme-hero .prop { position:absolute; right:18px; top:50%; transform:translateY(-50%); width:84px; height:84px; object-fit:contain; }
.theme-pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
@media (max-width:520px) { .theme-hero { padding-right:22px; } .theme-hero .prop { position:static; transform:none; width:56px; height:56px; margin-bottom:8px; } }
.cta-band { display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; padding:26px 20px; border-radius:26px; background:linear-gradient(135deg, color-mix(in srgb, #7C3AED 16%, var(--surface)), var(--surface) 70%); border:1px solid color-mix(in srgb, #7C3AED 24%, var(--surface)); }
.cta-band h2 { font-size:22px; }
.cta-band p { margin:0; color:var(--muted); max-width:52ch; }
.tile .t { font-family:var(--display); font-weight:700; font-size:18px; line-height:1.2; }
.tile .c { font-size:13px; color:var(--muted); }
.mini { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--soft); margin-top:4px; }
.mini span { height:100%; }
.mini span.unrated { background:repeating-linear-gradient(45deg,var(--surface) 0 2px,var(--hatch) 2px 4px); }
.tags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; border-radius:999px; padding:3px 9px; background:var(--soft); color:var(--fg); border:0; font-family:inherit; cursor:pointer; text-decoration:none; }
.chip.multi { background:var(--accent-soft); font-weight:600; cursor:default; }
.chip.diverge { background:var(--warn-bg); color:var(--warn-fg); font-weight:600; cursor:help; }
.chip.votona { background:none; border:1px solid var(--accent); color:var(--link); }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tabs button, .tabs a { text-decoration:none; background:none; border:0; border-bottom:3px solid transparent; font:inherit; font-weight:600; color:var(--muted); padding:10px 12px; cursor:pointer; min-height:44px; }
.tabs [aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }

.pos > div { border-left:3px solid var(--accent); padding:4px 0 4px 14px; }
.pos strong { display:block; font-family:var(--display); font-size:17px; }
.notice { border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; background:var(--surface); font-size:14px; }

<script>
const DATA = /*__DATA__*/{"generated_at":null,"facts":[],"sources":[],"contact":"","candidates":[]};

const LEVELS = [
  ["true", "Vrai", 0], ["mostly_true", "Plutôt vrai", 1], ["half_true", "À moitié vrai", 2],
  ["mostly_false", "Plutôt faux", 3], ["false", "Faux", 4], ["unrated", "Non classable", -1],
];
const LEVEL = Object.fromEntries(LEVELS.map(([k, l, i]) => [k, { label: l, idx: i }]));
// Une vue = un usage : l'accueil résume, « Faits vérifiés » est le seul endroit à filtres complets,
// les autres vues entrent par une personne, un parti ou un sujet.
const TABS = [["accueil", "Accueil"], ["faits", "Faits vérifiés"], ["personnalites", "Personnalités"], ["partis", "Partis"], ["sujets", "Sujets"]];
// La Méthode s'ouvre par l'icône « ? » du bandeau et le pied de page, comme la FAQ de Votona.
const VIEWS = [...TABS, ["methodologie", "Méthode"]];
const SCOPES = [["candidats", "Candidats 2027"], ["partis", "Leurs partis"], ["tout", "Toute la vie politique"]];
// Les 7 familles de sujets de Votona, dans son ordre.
const FAMILIES = [["economie", "Économie & travail"], ["social", "Protection sociale"], ["securite", "Sécurité & immigration"], ["ecologie", "Écologie"], ["europe", "Europe & institutions"], ["societe", "Société"], ["defense", "Défense & numérique"]];
// Couleur et accessoire de chaque famille : mêmes que Votona (CATEGORY_META.pop, assets/props).
const THEME = { economie: ["#FFB703", "economie"], social: ["#3A86FF", "protection-sociale"], securite: ["#FF6B6B", "securite"], ecologie: ["#06D6A0", "ecologie"], europe: ["#6C5CE7", "europe"], societe: ["#FF5DA2", "societe"], defense: ["#00B4D8", "defense"] };
const PROPS = /*__PROPS__*/{};
const propImg = (id, cls = "prop") => PROPS[THEME[id][1]] ? el("img", { class: cls, src: PROPS[THEME[id][1]], alt: "", width: 44, height: 44, loading: "lazy" }) : null;
const FAMILY_ID = Object.fromEntries(FAMILIES.map(([id, l]) => [l, id]));
const VOTONA = "https://votona.fr";
const SCOPE = "Sur les déclarations vérifiées, pas sur l'ensemble des propos tenus.";

const facts = DATA.facts.map((f) => {
  const rated = new Set(f.reviews.map((r) => r.rating_normalized).filter((k) => k !== "unrated"));
  return { ...f, reviewDate: f.reviews.map((r) => r.review_date).filter(Boolean).sort().pop() || null,
    family: FAMILY_ID[f.theme] || null, topics: f.votona_topics || [],
    nSources: new Set(f.reviews.map((r) => r.source_id)).size,
    // Divergence : des rédactions placent la même déclaration à des niveaux différents.
    diverge: rated.size > 1 };
});
const partyLabel = (p) => p.short_name ? p.name + " (" + p.short_name + ")" : p.name;
const persons = {}, parties = {};
for (const f of facts) {
  persons[f.person.id] = f.person.name;
  // Du plus récent au plus ancien : un parti garde son nom le plus récent (RN, pas FN).
  if (f.party.id) parties[f.party.id] ||= partyLabel(f.party);
}
const candidates = DATA.candidates.map((c) => ({ ...c, pid: c.person_id || "votona:" + c.votona_id }));
const candidateById = Object.fromEntries(candidates.map((c) => [c.pid, c]));
for (const c of candidates) persons[c.pid] ||= c.name;
const candidateParties = new Set(candidates.filter((c) => c.party_id).map((c) => c.party_id));
const sourceNames = Object.fromEntries(DATA.sources.map((s) => [s.id, s.name]));
const usedSources = [...new Set(facts.flatMap((f) => f.reviews.map((r) => r.source_id)))].sort((a, b) => (sourceNames[a] || a).localeCompare(sourceNames[b] || b, "fr"));
const votonaTopics = (DATA.topics || []).map((t) => ({ ...t, family: FAMILY_ID[t.category] }));
const today = DATA.generated_at ? DATA.generated_at.slice(0, 10) : new Date().toISOString().slice(0, 10);
const inScope2027 = (f) => candidateById[f.person.id] || (f.party.id && candidateParties.has(f.party.id));

const DEFAULTS = { scope: "candidats", period: "all", from: "", to: "", dateBy: "claim", party: "", person: "", source: "", family: "", multi: false, verdicts: new Set(LEVELS.map((l) => l[0])) };
const state = { view: "accueil", id: null, ...DEFAULTS, verdicts: new Set(DEFAULTS.verdicts), limit: 30, report: null, who: "candidats", q: "" };

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const frDate = (iso, long) => {
  if (!iso) return "date inconnue";
  if (iso.length === 7) return new Date(iso + "-15T12:00:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const d = new Date(iso.slice(0, 10) + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("fr-FR", { day: "numeric", month: long ? "long" : "short", year: "numeric" });
};
const plural = (n, one, many) => n + " " + (n > 1 ? many : one);
const initialsOf = (name) => name.split(/[\s-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const shift = (days) => { const d = new Date(today + "T12:00:00"); d.setDate(d.getDate() - days); return d.toISOString().slice(0, 10); };
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); };
const swatch = (k) => el("span", { class: "sw" + (k === "unrated" ? " unrated" : ""), style: k === "unrated" ? null : "background: var(--v-" + k + ")", "aria-hidden": "true" });
const byDate = (a, b) => ((b.claim_date || "") + b.id).localeCompare((a.claim_date || "") + a.id);
const ext = (href, text, attrs = {}) => el("a", { href, target: "_blank", rel: "noopener", ...attrs }, text);
const vlink = (href, text, attrs = {}) => el("a", { href, ...attrs }, text);  // vers votona.fr, même onglet
const mascot = () => el("img", { class: "btn-mascot", src: document.querySelector(".brand img").getAttribute("src"), alt: "", width: 34, height: 29 });

function periodRange() {
  const p = state.period;
  if (p === "7") return [shift(7), today];
  if (p === "30") return [shift(30), today];
  if (p === "365") return [shift(365), today];
  if (p === "year") return [today.slice(0, 4) + "-01-01", today];
  if (p === "custom") return [state.from || "0000", state.to || "9999"];
  return ["0000", "9999"];
}

function filtered() {
  const [from, to] = periodRange();
  return facts.filter((f) => {
    const d = (state.dateBy === "claim" ? f.claim_date : f.reviewDate) || "";
    const inScope = state.scope === "tout" || candidateById[f.person.id]
      || (state.scope === "partis" && f.party.id && candidateParties.has(f.party.id));
    return inScope && d >= from && d.slice(0, 10) <= to
      && (!state.party || f.party.id === state.party)
      && (!state.person || f.person.id === state.person)
      && (!state.source || f.reviews.some((r) => r.source_id === state.source))
      && (!state.family || f.family === state.family)
      && (!state.multi || f.nSources > 1)
      && state.verdicts.has(f.verdict);
  }).sort(byDate);
}

function periodLabel() {
  const [from, to] = periodRange();
  if (state.period === "all") return "toute la période couverte";
  return "du " + frDate(from === "0000" ? null : from) + " au " + frDate(to === "9999" ? null : to);
}

/* ---------- navigation ---------- */
const ROUTE = { personne: "personne-", parti: "parti-", sujet: "sujet-" };
// Sur le site, les fiches ont des pages fixes (pipeline/build_pages.py) : on y va plutôt que de
// les afficher dans l'app. Dans l'artefact (pas de DATA.urls), tout reste dans l'app.
const STATIC_VIEWS = { personnalites: "/candidats/", partis: "/partis/", sujets: "/sujets/", methodologie: "/methode/" };
function staticUrl(view, id) {
  if (!DATA.urls) return null;
  if (view === "personne") return DATA.urls.persons[id] || null;
  if (view === "parti") return DATA.urls.parties[id] || null;
  if (view === "sujet") return "/sujets/" + id + "/";
  return STATIC_VIEWS[view] || null;
}
function go(view, id = null) {
  const url = staticUrl(view, id);
  if (url) { location.href = url; return; }
  state.view = view; state.id = id; state.limit = 30; state.report = null;
  try { history.replaceState(null, "", "#" + (id ? ROUTE[view] + id : view)); } catch (e) { /* hors d'un navigateur classique */ }
  render(); window.scrollTo(0, 0);
}
// Ouvre « Faits vérifiés » déjà filtré (depuis un sujet, un parti, une tuile).
function openFacts(preset) {
  Object.assign(state, DEFAULTS, { verdicts: new Set(DEFAULTS.verdicts) }, preset);
  go("faits");
}
function fromHash() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  const m = h.match(/^(personne|parti|sujet)-(Q\d+|votona:[a-z0-9-]+|[a-z]+)$/);
  if (m && (m[1] === "personne" ? persons[m[2]] : m[1] === "parti" ? parties[m[2]] : FAMILIES.some(([id]) => id === m[2]))) { state.view = m[1]; state.id = m[2]; }
  else if (h === "candidats") { state.view = "personnalites"; state.who = "candidats"; }
  // Liens entrants depuis votona.fr : #candidat-<identifiant Votona> (fiche candidat).
  else if (h.startsWith("candidat-") && candidates.some((c) => c.votona_id === h.slice(9))) { state.view = "personne"; state.id = candidates.find((c) => c.votona_id === h.slice(9)).pid; }
  else if (VIEWS.some(([v]) => v === h)) state.view = h;
  // Anciennes adresses (#personne-…, #candidat-lepen depuis votona.fr…) : vers la page fixe.
  const url = staticUrl(state.view, state.id);
  if (url) location.replace(url);
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

/* ---------- composants ---------- */
function filtersBar() {
  const sel = (id, label, value, options, onChange) => el("label", { for: id }, label,
    el("select", { id, on: { change: (e) => { onChange(e.target.value); state.limit = 30; render(); } } },
      options.map(([v, t]) => el("option", { value: v, selected: v === value }, t))));
  const custom = state.period === "custom" ? [
    el("label", { for: "f-from" }, "Du", el("input", { type: "date", id: "f-from", value: state.from, on: { change: (e) => { state.from = e.target.value; render(); } } })),
    el("label", { for: "f-to" }, "Au", el("input", { type: "date", id: "f-to", value: state.to, on: { change: (e) => { state.to = e.target.value; render(); } } })),
  ] : [];
  return el("section", { class: "filters", "aria-label": "Filtres" },
    el("fieldset", {}, el("legend", { text: "Périmètre" }), el("div", { class: "scope" }, SCOPES.map(([k, l]) => el("button", {
      type: "button", class: "pill", "aria-pressed": String(state.scope === k), on: { click: () => { state.scope = k; state.limit = 30; render(); } },
    }, l)))),
    sel("f-period", "Période", state.period, [["all", "Toute la période"], ["7", "7 derniers jours"], ["30", "30 derniers jours"], ["365", "12 derniers mois"], ["year", "Année " + today.slice(0, 4)], ["custom", "Personnalisée…"]], (v) => (state.period = v)),
    ...custom,
    sel("f-dateby", "Dater par", state.dateBy, [["claim", "Date de la déclaration"], ["review", "Date de la vérification"]], (v) => (state.dateBy = v)),
    sel("f-family", "Sujet", state.family, [["", "Tous les sujets"], ...FAMILIES], (v) => (state.family = v)),
    sel("f-party", "Parti", state.party, [["", "Tous les partis"], ...Object.entries(parties).sort((a, b) => a[1].localeCompare(b[1], "fr"))], (v) => (state.party = v)),
    sel("f-person", "Personne", state.person, [["", "Toutes les personnes"], ...Object.entries(persons).sort((a, b) => a[1].localeCompare(b[1], "fr"))], (v) => (state.person = v)),
    sel("f-source", "Rédaction", state.source, [["", "Toutes les rédactions"], ...usedSources.map((s) => [s, sourceNames[s] || s])], (v) => (state.source = v)),
    el("fieldset", {}, el("legend", { text: "Recoupement" }), el("div", { class: "pills" }, el("button", {
      type: "button", class: "pill", "aria-pressed": String(state.multi), on: { click: () => { state.multi = !state.multi; render(); } },
    }, "Vérifié par plusieurs rédactions"))),
    el("fieldset", {}, el("legend", { text: "Verdict" }), el("div", { class: "pills" }, LEVELS.map(([k, l]) => el("button", {
      type: "button", class: "pill verdict", "aria-pressed": String(state.verdicts.has(k)),
      on: { click: () => { state.verdicts.has(k) ? state.verdicts.delete(k) : state.verdicts.add(k); render(); } },
    }, swatch(k), l)))),
    el("button", { type: "button", class: "reset", on: { click: () => { Object.assign(state, DEFAULTS, { verdicts: new Set(DEFAULTS.verdicts) }); render(); } } }, "Réinitialiser"));
}

function counts(list) { return Object.fromEntries(LEVELS.map(([k]) => [k, list.filter((f) => f.verdict === k).length])); }

function summary(list, note) {
  const n = list.length, c = counts(list);
  const sources = new Set(list.flatMap((f) => f.reviews.map((r) => r.source_id)));
  const last = list.map((f) => f.reviewDate).filter(Boolean).sort().pop();
  const multi = list.filter((f) => f.nSources > 1).length;
  return el("section", { class: "summary" },
    el("div", { class: "bars" },
      el("div", {}, el("h2", { text: plural(n, "déclaration vérifiée", "déclarations vérifiées") }), el("p", { class: "scope-note", text: SCOPE + " " + (note || "Période : " + periodLabel() + ".") })),
      el("div", { role: "list", "aria-label": "Répartition par verdict" }, LEVELS.map(([k, l]) => el("div", { class: "bar-row", role: "listitem" },
        el("span", { class: "lab", text: l }),
        el("div", { class: "track" }, el("div", { class: "fill" + (k === "unrated" ? " unrated" : ""), style: "width:" + (n ? (c[k] / n) * 100 : 0) + "%" + (k === "unrated" ? "" : ";background:var(--v-" + k + ")") })),
        el("span", { class: "num" }, String(c[k]), el("span", { class: "muted", text: " · " + (n ? Math.round((c[k] / n) * 100) : 0) + " %" })))))),
    el("aside", { class: "side" },
      el("div", {}, el("div", { class: "k", text: "Rédactions" }), el("div", { class: "v", text: String(sources.size) }), el("div", { class: "small muted", text: [...sources].map((s) => sourceNames[s] || s).join(" · ") || "—" })),
      el("div", {}, el("div", { class: "k", text: "Vérifiées par plusieurs rédactions" }), el("div", { class: "v", text: String(multi) })),
      el("div", {}, el("div", { class: "k", text: "Vérification la plus récente" }), el("div", { class: "v", style: "font-size:18px", text: last ? frDate(last, true) : "—" }))));
}

// Barre de répartition compacte (tuiles) : jamais un score, seulement la répartition des verdicts.
function miniBar(list) {
  const n = list.length, c = counts(list);
  return el("div", { class: "mini", role: "img", "aria-label": LEVELS.filter(([k]) => c[k]).map(([k, l]) => c[k] + " " + l.toLowerCase()).join(", ") || "aucune vérification" },
    LEVELS.filter(([k]) => c[k]).map(([k]) => el("span", { class: k === "unrated" ? "unrated" : null, style: "width:" + (c[k] / n) * 100 + "%" + (k === "unrated" ? "" : ";background:var(--v-" + k + ")") })));
}

function meter(k) {
  const i = LEVEL[k]?.idx ?? -1;
  return el("div", { class: "meter", "aria-hidden": "true" }, [0, 1, 2, 3, 4].map((x) => el("span", { style: x === i ? "background:var(--v-" + k + ")" : null })));
}

function partyText(f) {
  if (f.party.id) return f.party.short_name || f.party.name;
  if (f.party.status === "no_party") return "sans étiquette";
  return "parti non renseigné";
}

function verdictLines(f) {
  return f.reviews.map((r) => el("div", { class: "verdict" },
    el("strong", { text: LEVEL[r.rating_normalized]?.label || r.rating_normalized }),
    el("span", { class: "muted" }, " — « " + (r.rating_original || "sans libellé") + " » selon ", ext(r.url, r.source_name))));
}

function datesLine(f) {
  return el("div", { class: "dates" }, "Déclaration : ", el("span", { class: f.date_is_fallback ? "fallback" : null, title: f.date_is_fallback ? "Date de déclaration non fournie par la source : date de vérification utilisée" : null, text: frDate(f.claim_date) }),
    " · Vérification : " + frDate(f.reviewDate));
}

function personLink(f) {
  return el("div", { class: "who" }, el("button", { type: "button", class: "linkish", on: { click: () => go("personne", f.person.id) } }, f.person.name), " ",
    el("span", { class: "muted", text: "· " + partyText(f) + " à cette date" }));
}

// Repères propres à l'Observatoire : recoupement, divergence, sujet et passerelle vers Votona.
function factTags(f) {
  const t = f.topics[0];
  return el("div", { class: "tags" },
    f.nSources > 1 ? el("span", { class: "chip multi", text: "Vérifié par " + f.nSources + " rédactions" }) : null,
    f.diverge ? el("span", { class: "chip diverge", title: "Les rédactions ne placent pas cette déclaration au même niveau : chaque verdict est affiché.", text: "Verdicts divergents" }) : null,
    f.family ? el("button", { type: "button", class: "chip", title: "Thème attribué automatiquement, à titre indicatif", on: { click: () => go("sujet", f.family) } }, f.theme) : null,
    t ? vlink(VOTONA + "/sujets/" + t.slug + "/", "Positions des candidats sur Votona", { class: "chip votona", title: t.label }) : null);
}

function card(f) {
  return el("article", { class: "card" }, personLink(f), el("p", { class: "claim", text: "« " + (f.claim_text || "") + " »" }), meter(f.verdict),
    el("div", { class: "verdict" }, el("strong", { text: LEVEL[f.verdict].label }),
      el("span", { class: "muted" }, " selon ", f.reviews.map((r, i) => [i ? ", " : "", ext(r.url, r.source_name)]))),
    datesLine(f), factTags(f));
}

function factRow(f, withPerson = true) {
  const open = state.report === f.id;
  return el("article", { class: "fact" },

      el("p", { text: "Périmètre par défaut : les candidats déclarés ou pressentis à la présidentielle 2027 de la liste Votona. « Leurs partis » ajoute les déclarations des membres de leurs partis, selon le parti en vigueur à la date de chaque déclaration. « Toute la vie politique » montre l'ensemble de la base : élus, membres du gouvernement, dirigeants de parti, maires." }),
      el("h2", { text: "Rédactions suivies" }),
      el("div", { class: "table-box" }, el("table", { class: "plain" }, el("thead", {}, el("tr", {}, el("th", { text: "Rédaction" }), el("th", { text: "Déclarations dans la base" }))),
        el("tbody", {}, usedSources.map((s) => el("tr", {}, el("td", { text: sourceNames[s] || s }), el("td", { class: "num", text: String(n[s]) })))))),
      el("p", { class: "small muted", text: "Collecte : API Google Fact Check Tools (vérifications déclarées par les rédactions) et flux ClaimReview de Data Commons (licence CC BY). Personnalités et affiliations : Wikidata." }),
      el("h2", { text: "Échelle commune" }),
      el("div", { class: "table-box" }, el("table", { class: "plain" }, el("thead", {}, el("tr", {}, el("th", { text: "Niveau" }), el("th", { text: "Exemples de libellés d'origine" }))),
        el("tbody", {}, [["true", "Vrai, Correct"], ["mostly_true", "Plutôt vrai"], ["half_true", "À moitié vrai, Imprécis, En partie vrai"], ["mostly_false", "Plutôt faux, Trompeur, Exagéré"], ["false", "Faux, Inventé"], ["unrated", "Manque de contexte, Montage, Invérifiable"]].map(([k, ex]) =>
          el("tr", {}, el("td", {}, swatch(k), " " + LEVEL[k].label), el("td", { text: ex })))))),
      el("h2", { text: "Données ouvertes" }),
      DATA.site ? el("p", {}, "Toute la base publiée est téléchargeable et réutilisable en citant l'Observatoire et chaque rédaction : ", el("a", { href: "/donnees/facts.json", text: "JSON" }), ", ", el("a", { href: "/donnees/facts.csv", text: "CSV" }), " et ", el("a", { href: "/flux.xml", text: "flux RSS des dernières vérifications" }), ". Métadonnées seulement : pour lire une vérification, suivez le lien vers la rédaction.")
        : el("p", { text: "Sur le site, toute la base publiée est téléchargeable (JSON, CSV) avec un flux RSS des dernières vérifications. Métadonnées seulement : pour lire une vérification, suivez le lien vers la rédaction." }),
      el("h2", { text: "Limites de la version bêta" }),
      el("ul", {},
        el("li", { text: "Périmètre : France ; personnalités ayant exercé une fonction publique depuis 2017, et tous les candidats 2027 de la liste Votona." }),
        el("li", { text: "Certains libellés intermédiaires sont classés « non classable » en attendant leur validation." }),
        el("li", { text: "Les affiliations partisanes de Wikidata sont souvent non datées : beaucoup de déclarations n'ont pas encore de parti indiqué." }),
        el("li", { text: "Le thème est attribué par mots-clés : certaines déclarations restent sans sujet." })),
      el("h2", { text: "Contester une entrée, vos droits" }),
      el("p", {}, "Pour signaler une erreur, demander une rectification ou vous opposer au traitement de données vous concernant, écrivez à ", el("strong", { text: DATA.contact }), " en indiquant la référence de l'entrée (bouton « Signaler une erreur »). Une attribution contestée à raison est retirée sous 48 heures."),
      el("p", { class: "small muted", text: "Données mises à jour le " + frDate(DATA.generated_at, true) + "." }))];
  },
};

function siteFooter() {
  const sep = () => " · ";
  const social = el("div", { class: "social" }); social.innerHTML = SOCIAL_HTML;
  return el("footer", { class: "gfoot" },
    "Votona Observatoire ne produit aucun verdict : il reprend celui de la rédaction, avec un lien vers l'article. Version bêta, mise à jour chaque jour" + (DATA.generated_at ? " (" + frDate(DATA.generated_at, true) + ")" : "") + ".",
    el("div", { class: "flinks" }, el("button", { type: "button", class: "linkish", "data-go": "methodologie" }, "Méthode"), sep(),
      DATA.site ? [el("a", { href: "/donnees/facts.csv" }, "Données ouvertes"), sep(), el("a", { href: "/flux.xml" }, "Flux RSS"), sep()] : null,
      vlink(VOTONA + "/a-propos/", "À propos"), sep(), vlink(VOTONA + "/mentions-legales/", "Mentions légales"), sep(),
      vlink(VOTONA + "/confidentialite/", "Confidentialité"), sep(), vlink(VOTONA + "/contact/", "Contact")),
    social);
}

function render() {
  const navView = { personne: "personnalites", parti: "partis", sujet: "sujets" }[state.view] || state.view;
  $("nav").replaceChildren(...TABS.map(([v, l]) => el(staticUrl(v) ? "a" : "button", staticUrl(v) ? { href: staticUrl(v), "aria-current": v === navView ? "page" : null } : { type: "button", "data-go": v, "aria-current": v === navView ? "page" : null },
    v === "faits" ? ["Faits", el("span", { class: "lg", text: " vérifiés" })] : l)));
  $("btn-faq").setAttribute("aria-current", navView === "methodologie" ? "page" : "false");
  $("app").replaceChildren(...views[state.view](), siteFooter());
  const active = document.querySelector('nav.subnav [aria-current="page"]');
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

fromHash();
render();
</script>
