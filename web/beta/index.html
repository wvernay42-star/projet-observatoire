:root {
  --bg: #ffffff; --surface: #ffffff; --soft: #f1f2f4; --fg: #1a1a1a; --muted: #5f6368; --line: #e3e3e3;
  --band: #1b3a5c; --band-fg: #ffffff; --link: #1b3a5c; --accent-soft: #e8edf3; --off: #e6e7ea; --warn-bg: #fdf3e7; --warn-fg: #6b3a0c;

}

  --bg: #11151a; --surface: #171c22; --soft: #1f262e; --fg: #e9ebee; --muted: #a5adb7; --line: #2e3640;
  --band: #0e2236; --band-fg: #e9ebee; --link: #9cc3ea; --accent-soft: #1f2d3c; --off: #2c343e; --warn-bg: #2f2214; --warn-fg: #f2c492;
  --v-true: #4f8fd6; --v-mostly_true: #9dc0e6; --v-half_true: #b9b2a4; --v-mostly_false: #f2b57e; --v-false: #e07a32;
  --hatch: #4a525c; --unrated-line: #8d96a1; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151a; --surface: #171c22; --soft: #1f262e; --fg: #e9ebee; --muted: #a5adb7; --line: #2e3640;
  --band: #0e2236; --band-fg: #e9ebee; --link: #9cc3ea; --accent-soft: #1f2d3c; --off: #2c343e; --warn-bg: #2f2214; --warn-fg: #f2c492;
  --v-true: #4f8fd6; --v-mostly_true: #9dc0e6; --v-half_true: #b9b2a4; --v-mostly_false: #f2b57e; --v-false: #e07a32;
  --hatch: #4a525c; --unrated-line: #8d96a1; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--link); }
h1, h2, h3 { font-family: var(--serif); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 40px); }
h2 { font-size: 24px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.beta { background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; }
.beta .wrap { padding-block: 8px; }
header.top { background: var(--band); color: var(--band-fg); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 10px; }
.logo { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--band-fg); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 8px 0; }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; }
nav.main button { background: none; border: 0; color: var(--band-fg); font: inherit; padding: 12px 12px; cursor: pointer; border-bottom: 3px solid transparent; min-height: 44px; }
nav.main button[aria-current="page"] { font-weight: 600; border-bottom-color: var(--band-fg); }

main.wrap { display: flex; flex-direction: column; gap: 28px; padding-block: 28px 48px; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.filters label, .filters fieldset { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; border: 0; padding: 0; margin: 0; min-width: 0; }
.filters select, .filters input[type="search"], .filters input[type="date"] { min-height: 44px; font: inherit; font-weight: 400; font-size: 14px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); max-width: 100%; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 20px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pill[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--link); font-weight: 600; }
.pill[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
.sw.unrated { background: repeating-linear-gradient(45deg, var(--surface) 0 3px, var(--hatch) 3px 5px); border: 1px dashed var(--unrated-line); }
.reset { background: none; border: 0; color: var(--link); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; min-height: 40px; }

.summary { display: flex; flex-wrap: wrap; gap: 28px; }
.summary .bars { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 84px; align-items: center; gap: 12px; font-size: 15px; }
.bar-row .lab { font-weight: 600; }
.track { height: 22px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; }
.fill.unrated { background: repeating-linear-gradient(45deg, var(--surface) 0 4px, var(--hatch) 4px 6px); box-shadow: inset 0 0 0 1px var(--unrated-line); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.side { flex: 1 1 260px; border: 1px solid var(--line); border-radius: 8px; align-self: flex-start; }
.side > div { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.side > div:last-child { border-bottom: 0; }
.side .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.side .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scope { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.claim { font-family: var(--serif); font-size: 18px; line-height: 1.35; margin: 0; }
.meter { display: flex; gap: 3px; }
.meter span { width: 30px; height: 10px; border-radius: 2px; background: var(--off); }
.verdict { font-size: 14px; }
.verdict strong { font-size: 15px; }
.dates { font-size: 13px; color: var(--muted); }
.fallback { font-style: italic; }
.who { font-size: 14px; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--link); cursor: pointer; text-decoration: none; font-weight: 700; text-align: left; }
.linkish:hover { text-decoration: underline; }

.facts { display: flex; flex-direction: column; }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 260px); gap: 8px 24px; padding: 18px 0; border-top: 1px solid var(--line); }
.fact .right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; text-align: right; }
@media (max-width: 640px) { .fact { grid-template-columns: minmax(0, 1fr); } .fact .right { align-items: flex-start; text-align: left; } .bar-row { grid-template-columns: 100px minmax(0, 1fr) 70px; font-size: 14px; } }
.report { background: var(--accent-soft); border-radius: 6px; padding: 10px 12px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.report code { font-size: 12px; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
.more { align-self: center; }

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 24px; }
.people button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font: inherit; cursor: pointer; min-height: 44px; }
.people button:hover .n1 { text-decoration: underline; }
.people .n2 { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.head { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--soft); color: var(--link); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 30px; font-weight: 700; flex: none; }
.timeline { position: relative; height: 44px; border-bottom: 2px solid var(--line); }
.timeline span { position: absolute; bottom: 7px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-7px); }
.timeline span.unrated { background: var(--surface); border: 2px dashed var(--unrated-line); }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.prose { max-width: 70ch; display: flex; flex-direction: column; gap: 14px; }
.prose p, .prose ul { margin: 0; }
.prose li { margin-bottom: 6px; }
.table-box { overflow-x: auto; }
table.plain { border-collapse: collapse; font-size: 14px; min-width: 520px; }
table.plain th, table.plain td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
footer { border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--v-true); outline-offset: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; }
</style>

const LEVELS = [

const facts = DATA.facts.map((f) => ({ ...f, reviewDate: f.reviews.map((r) => r.review_date).filter(Boolean).sort().pop() || null }));

const frDate = (iso, long) => {

function periodRange() {
  const p = state.period;
  if (p === "7") return [shift(7), today];
  if (p === "30") return [shift(30), today];
  if (p === "365") return [shift(365), today];
  if (p === "year") return [today.slice(0, 4) + "-01-01", today];
  if (p === "custom") return [state.from || "0000", state.to || "9999"];
  return ["0000", "9999"];

function filtered({ person = state.person, party = state.party } = {}) {
  const [from, to] = periodRange();
  return facts.filter((f) => {
    const d = (state.dateBy === "claim" ? f.claim_date : f.reviewDate) || "";
    return d >= from && d.slice(0, 10) <= to
      && (!party || f.party.id === party)
      && (!person || f.person.id === person)
      && (!state.source || f.reviews.some((r) => r.source_id === state.source))
      && state.verdicts.has(f.verdict);
  }).sort((a, b) => ((b.claim_date || "") + b.id).localeCompare((a.claim_date || "") + a.id));
}

function periodLabel() {
  const [from, to] = periodRange();
  if (state.period === "all") return "toute la période couverte";
  return "du " + frDate(from === "0000" ? null : from) + " au " + frDate(to === "9999" ? null : to);
}

/* ---------- navigation ---------- */
function go(view, id = null) {
  state.view = view; state.id = id; state.limit = 30; state.report = null;

  else if (VIEWS.some(([v]) => v === h)) state.view = h;

document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

    sel("f-period", "Période", state.period, [["all", "Toute la période"], ["7", "7 derniers jours"], ["30", "30 derniers jours"], ["365", "12 derniers mois"], ["year", "Année " + today.slice(0, 4)], ["custom", "Personnalisée…"]], (v) => (state.period = v)),
    ...custom,

        el("li", { text: "Seules des métadonnées sont reprises (titre, verdict, dates, lien), jamais le contenu des articles." }),
        el("li", { text: "Toute attribution incertaine est vérifiée à la main avant publication. Aucun classement des personnalités n'est proposé." })),
      el("h2", { text: "Sources" }),
